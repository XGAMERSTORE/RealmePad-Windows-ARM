name: Read-only Android boot image parser tests
on:
  push:
    paths:
      - 'tools/inspect_boot_image.py'
      - 'tests/test_inspect_boot_image.py'
      - '.github/workflows/boot-image-inspection.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Android boot image header parser
        run: python -m unittest discover -s tests -p 'test_inspect_boot_image.py' -v

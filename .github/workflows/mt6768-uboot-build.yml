name: MT6768 patched U-Boot reference build

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/mt6768-uboot-build.yml'
      - 'tools/check_arm64_image.py'
      - 'docs/REALME_PAD_HARDWARE_EVIDENCE.md'

permissions:
  contents: read

jobs:
  build-mt6768-reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install ARM64 cross-build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu make bc bison flex \
            libssl-dev libgnutls28-dev libncurses-dev python3-dev swig

      - name: Fetch pinned MT6768 base and published board patch series
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/mt6768-mainline/u-boot.git u-boot
          git -C u-boot checkout --detach 0f587c97b74dbc161769a82b63249948eb15e143
          git clone https://github.com/hataketsu/mt6768-mainline-notes.git notes
          git -C notes checkout --detach 5db190b4570eb0276b52d652d914bd73fcdd8319
          test "$(git -C notes rev-parse HEAD)" = 5db190b4570eb0276b52d652d914bd73fcdd8319
          git -C notes rev-parse HEAD > notes-commit.txt
          git -C u-boot rev-parse HEAD > upstream-commit.txt
          test "$(find notes/uboot-patches -maxdepth 1 -name '00*.patch' | wc -l)" -eq 3

      - name: Apply actual board-support patches
        shell: bash
        run: |
          set -euo pipefail
          git -C u-boot -c user.name="MT6768 CI Patch Applicator" -c user.email="mt6768-ci@users.noreply.github.com" am "$PWD"/notes/uboot-patches/00*.patch
          test -f u-boot/configs/mt6768_defconfig
          test -f u-boot/board/mediatek/mt6768/Makefile
          git -C u-boot log -3 --oneline

      - name: Record toolchain and verify patched board configuration
        shell: bash
        run: |
          set -euo pipefail
          aarch64-linux-gnu-gcc --version | head -n 1 | tee compiler-version.txt
          test -f u-boot/arch/arm/dts/mt6768-generic.dts
          grep -q 'CONFIG_TARGET_XIAOMI_LANCELOT=y' u-boot/configs/mt6768_defconfig || { echo 'Reference target changed: inspect before proceeding'; exit 1; }

      - name: Build patched MT6768 Redmi 9 reference (NOT Realme Pad)
        shell: bash
        run: |
          set -euo pipefail
          make -C u-boot ARCH=arm CROSS_COMPILE=aarch64-linux-gnu- mt6768_defconfig
          make -C u-boot ARCH=arm CROSS_COMPILE=aarch64-linux-gnu- -j2
          test -s u-boot/u-boot.bin
          python3 tools/check_arm64_image.py u-boot/u-boot.bin
          sha256sum u-boot/u-boot.bin > u-boot.bin.sha256
          cp u-boot/.config u-boot-reference.config
          test -s u-boot-reference.config

      - name: Publish research-only artifact and source revisions
        uses: actions/upload-artifact@v4
        with:
          name: mt6768-redmi9-reference-NOT-FOR-FLASHING
          path: |
            u-boot/u-boot.bin
            u-boot.bin.sha256
            upstream-commit.txt
            notes-commit.txt
            compiler-version.txt
            u-boot-reference.config
          if-no-files-found: error

# This compiles an independently published Redmi 9 (lancelot) reference port.
# It is NOT an RMP2102/RMP2103 board port. Do not flash its artifacts.
# Realme Pad LK handoff, RAM carveouts, display, recovery and verified boot
# require independent device-specific evidence and hardware validation.

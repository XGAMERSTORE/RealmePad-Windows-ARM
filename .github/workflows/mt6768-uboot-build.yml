name: MT6768 patched U-Boot reference build

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/mt6768-uboot-build.yml'
      - 'tools/check_arm64_image.py'
      - 'tools/test_check_arm64_image.py'
      - 'tools/check_realme_pad_dtb.py'
      - 'tools/test_check_realme_pad_dtb.py'
      - 'bootloader/uboot/mt6768-realme-pad.dts'
      - 'docs/REALME_PAD_HARDWARE_EVIDENCE.md'

permissions:
  contents: read

jobs:
  test-arm64-header:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Run boot image validator unit tests
        run: python3 -m unittest discover -s tools -p 'test_*.py' -v

  build-mt6768-reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install ARM64 cross-build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu make bc bison flex \
            libssl-dev libgnutls28-dev libncurses-dev python3-dev swig device-tree-compiler

      - name: Fetch pinned MT6768 base and published board patch series
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/mt6768-mainline/u-boot.git u-boot
          git -C u-boot checkout --detach 0f587c97b74dbc161769a82b63249948eb15e143
          test "$(git -C u-boot rev-parse HEAD)" = 0f587c97b74dbc161769a82b63249948eb15e143
          git clone https://github.com/hataketsu/mt6768-mainline-notes.git notes
          git -C notes checkout --detach 5db190b4570eb0276b52d652d914bd73fcdd8319
          test "$(git -C notes rev-parse HEAD)" = 5db190b4570eb0276b52d652d914bd73fcdd8319
          git -C notes rev-parse HEAD > notes-commit.txt
          git -C u-boot rev-parse HEAD > upstream-commit.txt
          test "$(find notes/uboot-patches -maxdepth 1 -name '00*.patch' | wc -l)" -eq 3

      - name: Apply actual board-support patches
        shell: bash
        run: |
          set -euo pipefail
          if ! git -C u-boot -c user.name="MT6768 CI Patch Applicator" -c user.email="mt6768-ci@users.noreply.github.com" am "$PWD"/notes/uboot-patches/00*.patch; then
            git -C u-boot am --show-current-patch=diff > failed-board-patch.diff || true
            git -C u-boot am --abort || true
            echo 'Pinned MT6768 patch series did not apply; inspect failed-board-patch.diff' >&2
            exit 1
          fi
          git -C u-boot rev-parse HEAD > patched-upstream-commit.txt
          test -f u-boot/configs/mt6768_defconfig
          test -f u-boot/board/mediatek/mt6768/Makefile
          git -C u-boot log -3 --oneline

      - name: Record toolchain and verify patched board configuration
        shell: bash
        run: |
          set -euo pipefail
          aarch64-linux-gnu-gcc --version | head -n 1 | tee compiler-version.txt
          test -f u-boot/arch/arm/dts/mt6768-generic.dts
          # Published MT6768 patch series does not promise a Xiaomi-specific Kconfig symbol.
          # Record actual target symbols instead of assuming a Xiaomi-specific symbol.
          grep -E '^CONFIG_TARGET_[A-Z0-9_]+=y$' u-boot/configs/mt6768_defconfig > reference-target-symbols.txt || true
          cat reference-target-symbols.txt

      - name: Build patched MT6768 Redmi 9 reference (NOT Realme Pad)
        shell: bash
        run: |
          set -euo pipefail
          make -C u-boot ARCH=arm CROSS_COMPILE=aarch64-linux-gnu- mt6768_defconfig
          grep -E '^CONFIG_TARGET_[A-Z0-9_]+=y$' u-boot/.config > built-target-symbols.txt || true
          cat built-target-symbols.txt
          cpp -nostdinc -undef -D__DTS__ -x assembler-with-cpp \
            -I u-boot/arch/arm/dts -I u-boot/include \
            -I u-boot/arch/arm/include -I u-boot/include/generated \
            bootloader/uboot/mt6768-realme-pad.dts > realme-pad-preprocessed.dts
          dtc -I dts -O dtb -o realme-pad-experimental.dtb realme-pad-preprocessed.dts
          test -s realme-pad-experimental.dtb
          test "$(fdtget -t s realme-pad-experimental.dtb / compatible | awk '{print $1}')" = 'realme,rmp6768'
          for node in /soc/serial@11002000 /soc/mmc@11230000; do
            # Device addresses vary between DTS revisions; do not assume nodes exist.
            if fdtget -t s realme-pad-experimental.dtb "$node" status >/dev/null 2>&1; then
              test "$(fdtget -t s realme-pad-experimental.dtb "$node" status)" = disabled
            fi
          done
          if fdtdump realme-pad-experimental.dtb 2>/dev/null | grep -Eq 'reg = <0x0 0x40000000 0x0 0x80000000>'; then
            echo 'Rejected: copied 2GiB generic DRAM bank'; exit 1
          fi
          python3 tools/check_realme_pad_dtb.py realme-pad-experimental.dtb
          make -C u-boot ARCH=arm CROSS_COMPILE=aarch64-linux-gnu- -j2
          test -s u-boot/u-boot.bin
          # u-boot.bin is a raw binary, NOT a Linux ARM64 Image with a 64-byte header.
          # Validate the linked ELF architecture instead of misparsing the raw binary.
          test -s u-boot/u-boot
          aarch64-linux-gnu-readelf -h u-boot/u-boot > u-boot-elf-header.txt
          grep -Eq 'Machine:[[:space:]]*AArch64' u-boot-elf-header.txt
          grep -Eq 'Class:[[:space:]]*ELF64' u-boot-elf-header.txt
          sha256sum u-boot/u-boot.bin > u-boot.bin.sha256
          cp u-boot/.config u-boot-reference.config
          test -s u-boot-reference.config

      - name: Publish research-only artifact and source revisions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mt6768-redmi9-reference-NOT-FOR-FLASHING
          path: |
            u-boot/u-boot.bin
            u-boot-elf-header.txt
            u-boot.bin.sha256
            upstream-commit.txt
            patched-upstream-commit.txt
            failed-board-patch.diff
            notes-commit.txt
            compiler-version.txt
            reference-target-symbols.txt
            built-target-symbols.txt
            u-boot-reference.config
            realme-pad-experimental.dtb
          if-no-files-found: warn

# This compiles an independently published Redmi 9 reference port.
# NOT a Realme Pad RMP2102/RMP2103 port. NEVER flash these artifacts.

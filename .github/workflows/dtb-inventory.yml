name: RMP6768 upstream DTB inventory
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/dtb_inventory.py'
      - 'tests/test_dtb_inventory.py'
      - '.github/workflows/dtb-inventory.yml'
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline unit tests
        run: python -m unittest discover -s tests -v
      - name: Retrieve upstream DTB names
        run: python tools/dtb_inventory.py > dtb-inventory.json
      - uses: actions/upload-artifact@v4
        with:
          name: rmp6768-dtb-inventory
          path: dtb-inventory.json

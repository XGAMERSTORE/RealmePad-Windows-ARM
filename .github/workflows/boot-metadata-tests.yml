name: Safe boot metadata collector tests
on:
  push:
    paths:
      - 'tools/collect_boot_metadata.py'
      - 'tests/test_collect_boot_metadata.py'
      - '.github/workflows/boot-metadata-tests.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test ADB collector with mocked device
        run: python -m unittest discover -s tests -p 'test_collect_boot_metadata.py' -v

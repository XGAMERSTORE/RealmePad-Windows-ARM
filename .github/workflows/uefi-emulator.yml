name: ARM64 UEFI app build (host research only)
on:
  workflow_dispatch:
  push:
    paths:
      - 'uefi/**'
      - '.github/workflows/uefi-emulator.yml'
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: project
      - name: Install cross-compiler and build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu make uuid-dev nasm python3
      - name: Fetch pinned EDK2 release
        run: |
          git clone --depth 1 --branch edk2-stable202508 https://github.com/tianocore/edk2.git edk2
          cd edk2
          git submodule update --init --recursive
      - name: Test EFI verifier\n        run: python3 -m unittest discover -s project/tests -p 'test_verify_efi.py' -v\n      - name: Compile AARCH64 UEFI app
        shell: bash
        run: |
          set -euo pipefail
          export WORKSPACE="$GITHUB_WORKSPACE/edk2"
          export PACKAGES_PATH="$WORKSPACE:$GITHUB_WORKSPACE/project"
          export GCC5_AARCH64_PREFIX=aarch64-linux-gnu-
          cd "$WORKSPACE"
          make -C BaseTools -j2
          source edksetup.sh
          build -a AARCH64 -t GCC5 -b DEBUG -p uefi/RmpResearchHost.dsc
          find Build/RmpResearchHost -type f -name 'RmpResearchApp.efi' -print -quit | grep -q .
          find Build/RmpResearchHost -type f -name 'RmpResearchApp.efi' -print -quit | xargs -r -I '{}' cp '{}' "$GITHUB_WORKSPACE/RmpResearchApp.efi"
          test -s "$GITHUB_WORKSPACE/RmpResearchApp.efi"
          file "$GITHUB_WORKSPACE/RmpResearchApp.efi"\n          PYTHONPATH="$GITHUB_WORKSPACE/project" python3 "$GITHUB_WORKSPACE/project/tools/verify_efi.py" "$GITHUB_WORKSPACE/RmpResearchApp.efi" > "$GITHUB_WORKSPACE/efi-verification.json"
          sha256sum "$GITHUB_WORKSPACE/RmpResearchApp.efi" > "$GITHUB_WORKSPACE/RmpResearchApp.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: AARCH64-UEFI-APP-NOT-TABLET-FIRMWARE
          path: |
            RmpResearchApp.efi
            RmpResearchApp.sha256\n            efi-verification.json

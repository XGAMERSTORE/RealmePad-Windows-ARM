name: Read-only RMP6768 boot layout tests
on:
  push:
    paths:
      - 'tools/compare_boot_layout.py'
      - 'tests/test_compare_boot_layout.py'
      - 'research/upstream-boardconfig.json'
      - '.github/workflows/boot-layout-comparison.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify upstream boot layout comparisons
        run: python -m unittest discover -s tests -p 'test_compare_boot_layout.py' -v

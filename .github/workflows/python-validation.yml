name: Python source and regression validation
on:
  push:
    paths:
      - 'tools/**'
      - 'tests/**'
      - 'research/**'
      - '.github/workflows/python-validation.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile all Python modules
        run: python -m compileall -q tools tests
      - name: Run complete Python regression suite
        run: |
          python -m unittest discover -s tests -p 'test_*.py' -v
          python -m unittest discover -s tools -p 'test_check_lk_load_range.py' -v
